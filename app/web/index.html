<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RightCare — Medical Triage Assistant</title>
  <style>
    :root {
      --bg: #0b1220; --card:#101827; --muted:#778; --accent:#3b82f6; --text:#e6e7eb;
      --ring:#3b82f6aa; --bubble:#17223a; --bubble-user:#1f2c4a; --danger:#ef4444;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
    .wrap{max-width:900px;margin:40px auto;padding:0 20px}
    .title{font-weight:800;font-size:34px;letter-spacing:.4px;text-align:center;margin-bottom:22px}
    .card{background:var(--card);border:1px solid #1f2a44;border-radius:18px;padding:18px 18px 14px}
    .chat{max-height:58vh;overflow:auto;padding:8px 4px}
    .bubble{background:var(--bubble);padding:12px 14px;border-radius:14px;margin:8px 0;line-height:1.45}
    .bubble.user{background:var(--bubble-user);margin-left:auto}
    .row{display:flex;gap:10px;align-items:center;margin-top:12px}
    input,select,button{border-radius:12px;border:1px solid #2a3558;background:#0e1626;color:var(--text);padding:12px 14px;outline:none}
    input:focus,select:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring)}
    button{background:var(--accent);border:none;padding:12px 18px;font-weight:600;cursor:pointer;border-radius:14px}
    button:disabled{opacity:.6;cursor:not-allowed}
    .input{flex:1}
    .hint{color:var(--muted);font-size:.9rem;margin-top:10px;display:flex;gap:8px;align-items:center}
    .tag{font-size:.75rem;background:#0e1626;border:1px solid #2a3558;padding:6px 10px;border-radius:999px}
    .toolbar{display:flex;gap:8px;align-items:center}
    .kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">RightCare — Medical Triage Assistant</div>
    <div class="card">
      <div id="chat" class="chat"></div>
      <div class="row">
        <input id="text" class="input" placeholder="Describe your symptoms here..." />
        <div class="toolbar">
          <select id="lang">
            <option value="en" selected>English</option>
            <option value="ar">Arabic</option>
          </select>
          <button id="sendBtn" onclick="send()">Send</button>
        </div>
      </div>
      <div class="kpi">
        <span class="tag">Demo only</span>
        <span class="tag">Does not replace emergency care</span>
      </div>
      <div class="hint">Tip: Try "severe chest pain radiating to left arm" or "sprained ankle, can walk".</div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const textEl = document.getElementById('text');
    const langEl = document.getElementById('lang');
    const btn = document.getElementById('sendBtn');

    function add(role, text){
      const div = document.createElement('div');
      div.className = `bubble ${role==='user'?'user':''}`;
      div.textContent = text;
      chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
    }

    async function send(){
      const text = textEl.value.trim();
      if(!text) return; add('user', text); textEl.value=''; btn.disabled=true;
      add('ai', '…');
      try{
        const res = await fetch('/api/v1/assess', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({symptoms_text:text, language:langEl.value})});
        const data = await res.json();
        chat.lastChild.remove();
        add('ai', `${data.instructions}

→ ${data.recommendation==='ED'?'Go to Emergency Department':'Book outpatient appointment'}
🔗 ${data.next_step_url}`);
      }catch(e){
        chat.lastChild.remove();
        add('ai', 'Sorry — something went wrong.');
      } finally { btn.disabled=false; }
    }

    textEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey) send(); });
  </script>
</body>
</html>
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />

<body>

          <option value="en">English</option>
        </select>
        <button onclick="send()">إرسال</button>
      </div>
      <p class="small">⚠️ هذا نموذج تجريبي ولا يغني عن الرعاية الطبية الطارئة.</p>
    </div>
  </div>
  <script>
    function add(role, text){
      const div = document.createElement('div');
      div.className = `bubble ${role==='user'?'user':''}`;
      div.textContent = text;
      chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
    }
    async function send(){
      const text = document.getElementById('text').value.trim();
      const lang = document.getElementById('lang').value;
      if(!text) return; add('user', text); document.getElementById('text').value='';
      add('ai', '...');
      const res = await fetch('/api/v1/assess', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({symptoms_text:text, language:lang})});
      const data = await res.json();
      chat.lastChild.remove();
      add('ai', `${data.instructions}\n\n↪️ ${data.recommendation==='ED'?'الذهاب للطوارئ':'حجز موعد'}\n🔗 ${data.next_step_url}`);
    }
  </script>
</body>
</html>
