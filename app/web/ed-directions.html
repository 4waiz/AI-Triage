<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RightCare — ED Directions (Demo)</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0e1626; --text:#fefce8;
      --accent:#fde047; --accent2:#facc15;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      background:
        radial-gradient(900px 600px at 20% -10%, rgba(250,204,21,.1), transparent 60%),
        radial-gradient(1000px 700px at 110% 10%, rgba(253,224,71,.08), transparent 55%),
        var(--bg);
      color:var(--text); font:16px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .wrap{
      width:min(100%,980px);
      background:var(--panel);
      border-radius:18px; padding:18px;
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 0 20px rgba(250,204,21,.15);
    }
    h1{
      margin:0 0 8px;
      font-size:28px; letter-spacing:.3px;
      background:linear-gradient(90deg,#fffde7,#fef08a 40%,#fde047 70%);
      -webkit-background-clip:text; color:transparent;
    }
    .alert{
      background:#2a1f1f; border:1px solid #ef444477; border-radius:12px;
      padding:10px 12px; margin:10px 0; color:#ffdddd;
      font-weight:700;
    }
    .grid{display:grid; grid-template-columns:1fr 360px; gap:14px}
    iframe{width:100%; height:420px; border:0; border-radius:12px}
    .card{background:#121a24; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px}
    .label{opacity:.85; font-size:.95rem}
    .btn{
      display:inline-block; margin-top:10px; padding:12px 16px; border-radius:12px;
      background:linear-gradient(90deg,#facc15,#fde047); color:#222; text-decoration:none; font-weight:800;
      box-shadow:0 0 10px rgba(250,204,21,.3);
    }
    .back{display:inline-block;margin-top:12px;color:#fef08a;text-decoration:underline}
    @media (max-width:800px){ .grid{grid-template-columns:1fr} iframe{height:320px} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Emergency Department — Directions (Demo)</h1>
    <div class="alert">If you are in immediate danger or having severe symptoms, go to the nearest Emergency Department now.</div>

    <div class="grid">
      <div class="card">
        <!-- Demo map: change the location if you like -->
        <iframe
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3609.689803989628!2d54.4532785!3d24.2044276!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e5e6551a4a8f5c7%3A0x5c8d1cb51f3c5a6!2sCleveland%20Clinic%20Abu%20Dhabi!5e0!3m2!1sen!2s!4v1700000000000">
        </iframe>
      </div>

      <div class="card">
        <div class="label"><strong>Nearest ED (Demo):</strong><br/>Cleveland Clinic Abu Dhabi</div>
        <div class="label"><strong>Address:</strong><br/>Al Maryah Island, Abu Dhabi</div>
        <div class="label"><strong>Phone:</strong> +971 2 659 0200</div>
        <a class="btn" href="https://maps.google.com/?q=Cleveland+Clinic+Abu+Dhabi+Emergency" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        <br/>
        <a class="back" href="/">← Back to Assistant</a>
      </div>
    </div>
  </div>
</body>
</html>
